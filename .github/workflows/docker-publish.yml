name: docker-publish (auto from manifest)

on:
  push:
    tags:
      - "*@v*.*.*"
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: idbi/docker # owner/repo

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_json: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.SECRET_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  validate:
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.release_json == 'true' || needs.release.outputs.release_json == 'false'
    outputs:
      builds: ${{ steps.validate.outputs.builds }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate releases
        id: validate
        run: |
          builds=$(./.github/scripts/validate-releases.sh)
          {
            echo "builds<<EOF"
            echo "$builds"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  docker:
    name: docker (${{ matrix.build.label }})
    runs-on: ubuntu-latest
    needs: validate
    if: fromJson(needs.validate.outputs.builds) != '[]'
    strategy:
      # One job per image to push. A component with a `variants.json` expands
      # to several entries here, each with its own build args and tag list.
      fail-fast: false
      matrix:
        build: ${{ fromJson(needs.validate.outputs.builds) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.SECRET_TOKEN }}

      - name: Build and push ${{ matrix.build.label }}
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.build.component }}
          platforms: linux/amd64
          push: true
          # Composed by validate-releases.sh: the variant-suffixed tags, plus
          # the unsuffixed :version/:major/:latest for the default variant.
          tags: ${{ matrix.build.tags }}
          build-args: ${{ matrix.build.build_args }}
          # Scoped per variant: variants of one component share no layers, and
          # an unscoped cache lets whichever job finishes last evict the rest.
          cache-from: type=gha,scope=${{ matrix.build.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.build.cache_scope }}
          provenance: true
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.build.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true